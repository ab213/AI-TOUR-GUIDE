# Docker Compose configuration for AI Tour Guide
# This service runs the AI Tour Guide application with GPS and TTS support

services:
  tour-guide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-tour-guide
    restart: unless-stopped
    
    # Device access for GPS hardware (uncomment and adjust path as needed)
    # For Raspberry Pi: typically /dev/ttyAMA0 or /dev/ttyUSB0
    # For macOS development: typically /dev/ttys009 or similar
    # devices:
    #   - /dev/ttyAMA0:/dev/ttyAMA0  # Raspberry Pi GPS
    #   - /dev/ttyUSB0:/dev/ttyUSB0  # USB GPS dongle
    
    # Volume mounts for data persistence
    volumes:
      - ./data:/app/data:ro  # POI data (read-only)
      - ./llm/model:/app/llm/model:ro  # LLM model files (read-only)
      - ./llm/prompt.txt:/app/llm/prompt.txt:ro  # LLM prompt template
      - ./llm/test_prompt.txt:/app/llm/test_prompt.txt:ro  # Test prompt
    
    # Environment variables for configuration
    environment:
      - PYTHONUNBUFFERED=1
      - GPS_SERIAL_PORT=${GPS_SERIAL_PORT:-/dev/ttyAMA0}
      - ALERT_DISTANCE_MILES=${ALERT_DISTANCE_MILES:-0.25}
      - POI_COOLDOWN_MINUTES=${POI_COOLDOWN_MINUTES:-30}
      - GPS_TIMEOUT_SECONDS=${GPS_TIMEOUT_SECONDS:-10}
    
    # Network mode (host mode may be needed for GPS device access)
    # Uncomment if you need direct host network access
    # network_mode: host
    
    # Capabilities for device access (alternative to devices:)
    # Uncomment if you need privileged access for GPS
    # privileged: true
    
    # Health check (optional - can be customized)
    # healthcheck:
    #   test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 40s
